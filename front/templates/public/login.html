<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn</title>
    <link rel="stylesheet" href="../../static/css/styleLogin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>

<body class="login-bg d-flex align-items-center justify-content-center">

    <div class="container px-4">
        <div class="row justify-content-start">
            <div class="col-12 col-md-6 col-lg-5 col-xl-5">

                <div class="card aesthetic-glass shadow-lg border-danger rounded-4 p-1 p-md-4">

                    <div class="text-center text-uppercase fw-semibold mb-4">
                        <a href="../../templates/public/index.html" class="text-decoration-none">
                            <h3 class="fw-bold text-uppercase tracking-wide text-dark mb-2">
                                <i class="bi bi-box-seam text-danger me-4"></i>Core Logistics
                            </h3>
                        </a>
                        <p class="text-muted">Ingresa a la plataforma</p>
                    </div>

                    <form id="formLogin">
                        <div class="alert alert-danger d-none" id="errorLogin" role="alert"></div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control aesthetic-input" id="email" placeholder=""
                                required>
                            <label for="email">Correo Electrónico</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control aesthetic-input" id="password" placeholder=""
                                required>
                            <label for="password">Contraseña</label>
                        </div>
                        <button class="btn btn-danger w-100 py-3 rounded-3 fw-bold shadow-sm" type="submit">Ingresar</button>
                        <p class="text-center text-muted small mt-3 mb-0">
                            ¿No tienes cuenta?
                            <a href="registro.html" class="text-danger fw-bold text-decoration-none">Regístrate
                                aquí</a>
                        </p>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <a href="../../templates/public/index.html" class="text-decoration-none text-muted small">
                            <i class="bi bi-arrow-left me-1"></i> Volver a la página principal
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../static/js/auth.js"></script>
    <script>
        const form = document.getElementById("formLogin");
        const errorBox = document.getElementById("errorLogin");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorBox.classList.add("d-none");

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const data = await apiLogin(email, password);
                saveSession(data);
                redirectPorRol(data.usuario.rol);
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove("d-none");
            }
        });
    </script>
</body>

</html>

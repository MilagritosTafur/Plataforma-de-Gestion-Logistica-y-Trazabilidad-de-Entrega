<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../../static/css/styleLogin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>

<body class="login-bg d-flex align-items-center justify-content-center">

    <div class="container px-4">
        <div class="row justify-content-start">
            <div class="col-12 col-md-10 col-lg-7 col-xl-7">

                <div class="card aesthetic-glass shadow-lg border-danger rounded-4 p-1 p-md-4">

                    <div class="text-center text-uppercase fw-semibold mb-4">
                        <a href="index.html" class="text-decoration-none">
                            <h3 class="fw-bold text-uppercase tracking-wide text-dark mb-2">
                                <i class="bi bi-box-seam text-danger me-4"></i>Core Logistics
                            </h3>
                        </a>
                        <p class="text-muted">Crea tu cuenta de cliente</p>
                    </div>

                    <form id="formRegistro">
                        <div class="alert alert-danger d-none" id="errorRegistro" role="alert"></div>
                        <div class="alert alert-success d-none" id="successRegistro" role="alert"></div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control aesthetic-input" id="nombre" required>
                                    <label for="nombre">Nombre</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control aesthetic-input" id="apellido" required>
                                    <label for="apellido">Apellido</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" class="form-control aesthetic-input" id="email" required>
                            <label for="email">Correo Electrónico</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="tel" class="form-control aesthetic-input" id="telefono">
                            <label for="telefono">Teléfono (opcional)</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control aesthetic-input" id="password" minlength="8"
                                required>
                            <label for="password">Contraseña (mínimo 8 caracteres)</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" class="form-control aesthetic-input" id="passwordConfirm"
                                required>
                            <label for="passwordConfirm">Confirmar Contraseña</label>
                        </div>

                        <button class="btn btn-danger w-100 py-3 rounded-3 fw-bold shadow-sm" type="submit">Crear
                            Cuenta</button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <a href="login.html" class="text-decoration-none text-muted small">
                            <i class="bi bi-arrow-left me-1"></i> Ya tengo una cuenta, iniciar sesión
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../static/js/auth.js"></script>
    <script>
        const form = document.getElementById("formRegistro");
        const errorBox = document.getElementById("errorRegistro");
        const successBox = document.getElementById("successRegistro");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorBox.classList.add("d-none");
            successBox.classList.add("d-none");

            const password = document.getElementById("password").value;
            const passwordConfirm = document.getElementById("passwordConfirm").value;

            if (password !== passwordConfirm) {
                errorBox.textContent = "Las contraseñas no coinciden.";
                errorBox.classList.remove("d-none");
                return;
            }

            const payload = {
                nombre: document.getElementById("nombre").value.trim(),
                apellido: document.getElementById("apellido").value.trim(),
                email: document.getElementById("email").value.trim(),
                telefono: document.getElementById("telefono").value.trim() || null,
                password,
            };

            try {
                await apiRegistro(payload);
                successBox.textContent = "Cuenta creada correctamente. Iniciando sesión...";
                successBox.classList.remove("d-none");

                const loginData = await apiLogin(payload.email, password);
                saveSession(loginData);
                redirectPorRol(loginData.usuario.rol);
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove("d-none");
            }
        });
    </script>
</body>

</html>

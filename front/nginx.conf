server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location /auth {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /usuarios {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /templates/public/index.html;
    }
}

spring.application.name=demo

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:demo_db}
spring.datasource.username=${DB_USER:demo}
spring.datasource.password=${DB_PASSWORD:demo}

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET:cambia-este-secreto-de-desarrollo-por-uno-real-de-al-menos-32-caracteres}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

admin.default-email=${ADMIN_EMAIL:admin@demo.com}
admin.default-password=${ADMIN_PASSWORD:Admin123!}

spring.application.name=demo

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:demo_db}
spring.datasource.username=${DB_USER:demo}
spring.datasource.password=${DB_PASSWORD:demo}

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET:cambia-este-secreto-de-desarrollo-por-uno-real-de-al-menos-32-caracteres}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

admin.default-email=${ADMIN_EMAIL:admin@demo.com}
admin.default-password=${ADMIN_PASSWORD:Admin123!}

# Origenes permitidos para trabajar desde Docker/Nginx o Live Server.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501}


logging.level.org.springframework.security=INFO
logging.level.com.example.demo=INFO
server.port=${SERVER_PORT:8081}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn</title>
    <link rel="stylesheet" href="../../static/css/styleLogin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>

<body class="login-bg d-flex align-items-center justify-content-center">

    <div class="container px-4">
        <div class="row justify-content-start">
            <div class="col-12 col-md-10 col-lg-7 col-xl-7">

                <div class="card aesthetic-glass shadow-lg border-danger rounded-4 p-1 p-md-4">

                    <div class="text-center text-uppercase fw-semibold mb-4">
                        <a href="../../templates/public/index.html" class="text-decoration-none">
                            <h3 class="fw-bold text-uppercase tracking-wide text-dark mb-2">
                                <i class="bi bi-box-seam text-danger me-4"></i>Core Logistics
                            </h3>
                        </a>
                        <p class="text-muted">Selecciona tu perfil para ingresar a la plataforma</p>
                    </div>

                    <ul class="nav nav-pills nav-justified mb-4 border rounded-3 p-3 bg-white shadow-sm"
                        id="tabla-roles" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active rounded-3" id="rol-cliente-tab" data-bs-toggle="pill"
                                data-bs-target="#tabla-cliente" type="button" role="tab">
                                <i class="bi bi-person me-1"></i><span class="d-none d-sm-inline">Cliente</span>
                            </button>
                        </li>

                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-3" id="rol-operador-tab" data-bs-toggle="pill"
                                data-bs-target="#tabla-operador" type="button" role="tab">
                                <i class="bi bi-pc-display me-1"></i><span class="d-none d-sm-inline">Operador</span>
                            </button>
                        </li>

                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-3" id="rol-repartidor-tab" data-bs-toggle="pill"
                                data-bs-target="#tabla-repartidor" type="button" role="tab">
                                <i class="bi bi-truck me-1"></i><span class="d-none d-sm-inline">Repartidor</span>
                            </button>
                        </li>

                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-3" id="rol-admin-tab" data-bs-toggle="pill"
                                data-bs-target="#tabla-admin" type="button" role="tab">
                                <i class="bi bi-shield-lock me-1"></i><span class="d-none d-sm-inline">Admin</span>
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content" id="tabla-content">
                        <div class="tab-pane fade show active" id="tabla-cliente" role="tabpanel">
                            <form>
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control aesthetic-input" id="emailCliente"
                                        placeholder="">
                                    <label for="emailCliente">Correo Electrónico</label>
                                </div>
                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control aesthetic-input" id="passCliente"
                                        placeholder="">
                                    <label for="passCliente">Contraseña</label>
                                </div>
                                <a href="../../templates/dashboard/cliente.html">
                                    <button class="btn btn-danger w-100 py-3 rounded-3 fw-bold shadow-sm"
                                        type="button">Ingresar al Portal</button>
                                </a>
                            </form>
                        </div>

                        <div class="tab-pane fade" id="tabla-operador" role="tabpanel">
                            <form>
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control aesthetic-input" id="idOperador"
                                        placeholder="">
                                    <label for="idOperador">ID de Empleado o Correo Corporativo</label>
                                </div>
                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control aesthetic-input" id="passOperador"
                                        placeholder="">
                                    <label for="passOperador">Contraseña de Operaciones</label>
                                </div>
                                <a href="../../templates/dashboard/operador.html">
                                    <button class="btn btn-danger w-100 py-3 rounded-3 fw-bold shadow-sm"
                                        type="button">Acceder a Gestión</button>
                                </a>
                            </form>
                        </div>

                        <div class="tab-pane fade" id="tabla-repartidor" role="tabpanel">
                            <form>
                                <div class="form-floating mb-3">
                                    <input type="number" class="form-control aesthetic-input" id="dniRepartidor"
                                        placeholder="">
                                    <label for="dniRepartidor">Número de DNI</label>
                                </div>
                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control aesthetic-input" id="passRepartidor"
                                        placeholder="">
                                    <label for="passRepartidor">Código PIN Móvil</label>
                                </div>
                                <a href="../../templates/dashboard/repartidor.html">
                                    <button class="btn btn-danger w-100 py-3 rounded-3 fw-bold shadow-sm"
                                        type="button">Entrar a mi Ruta</button>
                                </a>

                            </form>
                        </div>

                        <div class="tab-pane fade" id="tabla-admin" role="tabpanel">
                            <form>
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control aesthetic-input" id="emailAdmin"
                                        placeholder="">
                                    <label for="emailAdmin">Correo de Administración</label>
                                </div>
                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control aesthetic-input" id="passAdmin"
                                        placeholder="">
                                    <label for="passAdmin">Contraseña Maestra</label>
                                </div>
                                <a href="../../templates/dashboard/admin.html">
                                    <button class="btn btn-dark w-100 py-3 rounded-3 fw-bold shadow-sm"
                                        type="button">Acceso
                                        Root</button>
                                </a>
                            </form>
                        </div>

                    </div>

                    <div class="text-center mt-4 pt-3 border-top">
                        <a href="../../templates/public/index.html" class="text-decoration-none text-muted small">
                            <i class="bi bi-arrow-left me-1"></i> Volver a la página principal
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

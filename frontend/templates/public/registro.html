<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta de cliente | Core Logistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../static/css/styleLogin.css?v=20260927-7">
</head>
<body class="login-bg d-flex align-items-center py-4">
    <main class="container">
        <section class="registration-panel card border-0 rounded-4 mx-auto"><div class="card-body p-4 p-md-5">
            <div class="row align-items-center g-3 mb-4"><div class="col-md"><div class="d-flex align-items-center gap-3"><a class="login-brand-mark text-decoration-none flex-shrink-0" href="index.html" aria-label="Volver al inicio"><i class="bi bi-person-plus-fill"></i></a><div><p class="text-uppercase text-danger small fw-bold mb-1" style="letter-spacing:.11em">Registro de cliente</p><h1 class="h3 fw-bold mb-0">Crea tu cuenta</h1></div></div></div><div class="col-md-auto"><span class="badge rounded-pill text-bg-light border text-secondary fw-semibold px-3 py-2"><i class="bi bi-shield-check text-success me-1"></i>Acceso protegido</span></div></div>
            <p class="text-secondary mb-4">Usa un correo que no esté registrado. Al terminar ingresarás automáticamente a tu panel de cliente.</p>
            <form id="formRegistro" novalidate autocomplete="off">
                <div class="alert alert-danger d-none" id="errorRegistro" role="alert"></div><div class="alert alert-success d-none" id="successRegistro" role="alert"></div>
                <div class="row g-3"><div class="col-md-6"><div class="form-floating"><input class="form-control" id="nombre" name="nombres-cliente" placeholder="Nombres" autocomplete="off" data-lpignore="true" required><label for="nombre">Nombres</label></div></div><div class="col-md-6"><div class="form-floating"><input class="form-control" id="apellido" name="apellidos-cliente" placeholder="Apellidos" autocomplete="off" data-lpignore="true" required><label for="apellido">Apellidos</label></div></div><div class="col-12"><div class="form-floating"><input type="email" class="form-control" id="email" name="correo-cliente" placeholder="correo@ejemplo.com" autocomplete="off" spellcheck="false" data-lpignore="true" required><label for="email"><i class="bi bi-envelope me-1"></i>Correo electrónico</label></div></div><div class="col-12"><div class="form-floating"><input type="tel" class="form-control" id="telefono" name="telefono-cliente" placeholder="Teléfono" autocomplete="off" data-lpignore="true"><label for="telefono"><i class="bi bi-telephone me-1"></i>Teléfono (opcional)</label></div></div><div class="col-md-6"><div class="form-floating"><input type="password" class="form-control" id="password" name="clave-nueva" placeholder="Contraseña" minlength="8" autocomplete="new-password" data-lpignore="true" required><label for="password"><i class="bi bi-key me-1"></i>Contraseña (mínimo 8 caracteres)</label></div></div><div class="col-md-6"><div class="form-floating"><input type="password" class="form-control" id="passwordConfirm" name="confirmar-clave" placeholder="Confirmar contraseña" autocomplete="new-password" data-lpignore="true" required><label for="passwordConfirm"><i class="bi bi-key-fill me-1"></i>Confirmar contraseña</label></div></div></div>
                <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mt-4"><p class="small text-secondary mb-0"><i class="bi bi-info-circle text-cyan me-1"></i>¿Necesitas cuenta de operador o repartidor? Solicítala al administrador.</p><button class="btn btn-danger px-4 py-2 fw-bold flex-shrink-0" type="submit">Crear mi cuenta <i class="bi bi-arrow-right ms-1"></i></button></div>
            </form>
            <div class="text-center border-top mt-4 pt-3 small"><span class="text-secondary">¿Ya tienes una cuenta?</span> <a class="text-danger fw-semibold text-decoration-none" href="login.html">Iniciar sesión</a></div>
        </div></section>
    </main>
    <script src="../../static/js/auth.js?v=20260927-7"></script>
    <script>
        const form = document.getElementById("formRegistro"), errorBox = document.getElementById("errorRegistro"), successBox = document.getElementById("successRegistro");
        const limpiarFormulario = () => { form.reset(); form.classList.remove("was-validated"); errorBox.classList.add("d-none"); successBox.classList.add("d-none"); };
        window.addEventListener("pageshow", limpiarFormulario);
        form.addEventListener("submit", async (evento) => {
            evento.preventDefault(); errorBox.classList.add("d-none"); successBox.classList.add("d-none");
            if (!form.checkValidity()) { form.classList.add("was-validated"); return; }
            const password = document.getElementById("password").value;
            if (password !== document.getElementById("passwordConfirm").value) { errorBox.textContent = "Las contraseñas no coinciden."; errorBox.classList.remove("d-none"); return; }
            const datos = { nombre: document.getElementById("nombre").value.trim(), apellido: document.getElementById("apellido").value.trim(), email: document.getElementById("email").value, telefono: document.getElementById("telefono").value.trim() || null, password };
            try { await apiRegistro(datos); successBox.textContent = "Cuenta creada. Estamos iniciando tu sesión…"; successBox.classList.remove("d-none"); const login = await apiLogin(datos.email, password); saveSession(login); limpiarFormulario(); redirectPorRol(login.usuario.rol); } catch (error) { errorBox.textContent = error.message; errorBox.classList.remove("d-none"); }
        });
    </script>
</body>
</html>

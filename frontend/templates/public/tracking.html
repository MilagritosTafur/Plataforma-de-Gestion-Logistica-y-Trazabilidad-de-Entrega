<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de envío | Core Logistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../static/css/style.css?v=20260927-7">
    <link rel="stylesheet" href="../../static/css/styleTracking.css?v=20260927-7">
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark navbar-core shadow-sm">
        <div class="container py-2"><a class="navbar-brand fw-bold" href="../public/index.html"><i
                    class="bi bi-box-seam-fill text-danger me-2"></i>CORE LOGISTICS</a><a
                class="btn btn-outline-light btn-sm" href="../public/registro.html"><i
                    class="bi bi-person-lock me-1"></i>Ingresar</a></div>
    </nav>
    <main class="container py-4 py-lg-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <a class="small text-decoration-none text-core fw-semibold" href="../public/index.html"><i
                        class="bi bi-arrow-left me-1"></i>Volver al inicio</a>
                <div class="surface-card bg-white p-3 p-md-4 mt-3 mb-4">
                    <form id="formNuevaConsulta" class="row g-2 align-items-end">
                        <div class="col-md"><label class="form-label fw-semibold" for="nuevoCodigo">Código de
                                seguimiento</label><input class="form-control" id="nuevoCodigo"
                                placeholder="CL-XXXXXXXXXX" autocomplete="off" required></div>
                        <div class="col-md-auto"><button class="btn btn-core w-100" type="submit"><i
                                    class="bi bi-search me-1"></i>Consultar</button></div>
                    </form>
                </div>
                <section id="contenidoTracking" aria-live="polite">
                    <div class="surface-card bg-white p-5 text-center">
                        <div class="spinner-border text-core mb-3" role="status"><span
                                class="visually-hidden">Cargando</span></div>
                        <p class="text-secondary mb-0">Preparando la consulta de trazabilidad…</p>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <footer class="footer-core text-white-50 py-4 mt-auto">
        <div class="container small d-flex justify-content-between"><span>Core Logistics</span><span>Seguimiento público
                protegido</span></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../static/js/logistica.js?v=20260927-7"></script>
    <script>
        const contenedor = document.getElementById("contenidoTracking");
        const parametros = new URLSearchParams(window.location.search);
        const codigo = parametros.get("codigo") || "";
        document.getElementById("nuevoCodigo").value = codigo;
        document.getElementById("formNuevaConsulta").addEventListener("submit", (evento) => {
            evento.preventDefault();
            const nuevoCodigo = document.getElementById("nuevoCodigo").value.trim();
            if (nuevoCodigo) window.location.href = `tracking.html?codigo=${encodeURIComponent(nuevoCodigo)}`;
        });
        function mostrarVacio(icono, titulo, detalle, tipo = "secondary") {
            contenedor.innerHTML = `<div class="surface-card bg-white p-5 text-center"><i class="bi ${icono} fs-1 text-${tipo} d-block mb-3"></i><h1 class="h4 fw-bold">${textoSeguro(titulo)}</h1><p class="text-secondary mb-0">${textoSeguro(detalle)}</p></div>`;
        }
        async function cargarTracking() {
            if (!codigo.trim()) return mostrarVacio("bi-upc-scan", "Ingresa un código", "Escribe el código de seguimiento para consultar los eventos disponibles.");
            try {
                let respuesta;
                try {
                    respuesta = await fetch(urlApi(`/tracking/${encodeURIComponent(codigo.trim())}`));
                } catch (error) {
                    throw new Error("No se pudo conectar con la plataforma. Verifica que Spring Boot esté activo en el puerto 8080.");
                }
                const envio = await respuesta.json().catch(() => ({}));
                if (!respuesta.ok) throw new Error(envio.message || "No encontramos el envío solicitado.");
                const eventos = envio.eventos.length ? envio.eventos.map((evento) => `<article class="timeline-step"><span class="timeline-icon"><i class="bi bi-check-lg"></i></span><h2 class="h6 fw-bold mb-1">${textoSeguro(textoEstado(evento.tipo))}</h2><p class="mb-1 text-secondary">${textoSeguro(evento.ubicacion || "Actualización logística")}</p><p class="small text-secondary mb-1">${textoSeguro(evento.observacion || "Evento registrado")}</p><time class="small text-muted">${fechaHora(evento.fecha)}</time></article>`).join("") : `<p class="text-secondary mb-0">Aún no hay eventos autorizados para mostrar.</p>`;
                contenedor.innerHTML = `<article class="surface-card bg-white overflow-hidden"><div class="p-4 p-md-5 border-bottom"><div class="d-flex flex-column flex-md-row justify-content-between gap-3"><div><p class="section-kicker mb-2">Seguimiento de envío</p><h1 class="h3 fw-bold mb-2">${textoSeguro(envio.codigoSeguimiento)}</h1><p class="text-secondary mb-0"><i class="bi bi-geo-alt me-1"></i>Destino: ${textoSeguro(envio.destino)}</p></div><div>${badgeEstado(envio.estado)}</div></div></div><div class="row g-0"><div class="col-md-4 bg-light p-4"><p class="small text-uppercase fw-bold text-secondary mb-1">Fecha estimada</p><p class="fw-semibold mb-0">${fechaCorta(envio.fechaEstimadaEntrega)}</p></div><div class="col-md-8 p-4"><h2 class="h5 fw-bold mb-4">Historial de movimientos</h2><div class="tracking-timeline">${eventos}</div></div></div></article>`;
            } catch (error) { mostrarVacio("bi-exclamation-circle", "No fue posible mostrar el seguimiento", error.message, "danger"); }
        }
        cargarTracking();
    </script>
</body>

</html>

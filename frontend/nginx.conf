server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # La pantalla pública vive en templates/public; en la raíz no existe index.html.
    # Sin esta redirección Nginx responde 403 al abrir http://localhost:3000.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        return 302 /templates/public/index.html;
    }

    # Nunca conservar HTML o JavaScript antiguo: evita que el navegador use una
    # versión anterior después de reconstruir el contenedor.
    location ^~ /templates/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location ^~ /static/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # Recursos estáticos restantes
    location / {
        try_files $uri =404;
    }

    # Backend: auth
    location /api/auth/ {
        proxy_pass http://app:8081/api/auth/;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend: el resto de la API
    location /api/ {
        proxy_pass http://app:8081/api/;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vista Thymeleaf pública: el backend renderiza el envío y sus eventos.
    location = /seguimiento {
        proxy_pass http://app:8081/seguimiento;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /recursos/ {
        proxy_pass http://app:8081/recursos/;
        proxy_set_header Host $host;
    }

    # (Opcional) por si en el futuro usas /auth directo
    location /auth/ {
        proxy_pass http://app:8081/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
